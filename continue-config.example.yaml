# Готовый конфиг Continue для пользователя. Копируется целиком в
#   Windows:      C:\Users\<логин>\.continue\config.yaml
#   Linux/macOS:  ~/.continue/config.yaml
# Файл создаёт само расширение Continue при первом запуске в VS Code;
# если его нет — поставьте расширение и откройте его один раз.
#
# Заменить нужно три вещи: АДРЕС-OLLAMA, АДРЕС-СЕРВЕРА и ТОКЕН.
# Ollama и сервер поиска — это разные машины: Continue ходит в модель
# напрямую, мимо kb, поэтому настройки из .env на него не действуют.
#
# После правки — ПОЛНЫЙ перезапуск VS Code. Reload window недостаточно:
# MCP-серверы при нём не переподключаются.
#
# Инструменты видны только в режиме Agent (переключатель внизу окна чата).
# В обычном Chat их нет, и выглядит это как «MCP не работает».

name: Local Assistant
version: 1.0.0
schema: v1

models:
  - name: Qwen3 8B
    provider: ollama
    model: qwen3:8b
    apiBase: http://АДРЕС-OLLAMA:11434
    roles: [chat, edit]
    # Именно requestOptions.headers, а НЕ apiKey: apiKey уходит как
    # "Authorization: Bearer <токен>", а шлюз ждёт заголовок x-api-key.
    # Если Ollama без шлюза — блок requestOptions убрать целиком.
    requestOptions:
      headers:
        x-api-key: ТОКЕН

  - name: BGE-M3 Embed
    provider: ollama
    model: bge-m3:latest
    apiBase: http://АДРЕС-OLLAMA:11434
    roles: [embed]
    requestOptions:
      headers:
        x-api-key: ТОКЕН

mcpServers:
  # Поиск по базе знаний, коду и задачам: kb_search + code_search + jira_search.
  # jira_search срабатывает только на слово «jira» в сообщении
  - name: knowledge-base
    type: streamable-http
    url: http://АДРЕС-СЕРВЕРА:8010/mcp

  # Граф кода (Graphify): структурные вопросы — кто вызывает функцию,
  # что сломается при изменении, какие модули центральные
  - name: code-graph
    type: streamable-http
    url: http://АДРЕС-СЕРВЕРА:8011/mcp

# Правила склеиваются в системный промпт для Agent, Chat и Edit.
# Копия из continue-rules.yaml — при правке менять в обоих местах.
# Каждое закрывает конкретную проблему, найденную на замерах: ответ
# сплошным текстом, отсутствие ссылок на источник, выдуманные пути и
# команды, обращение не к тому инструменту.
rules:
- Отвечай по-русски.
- 'Выбирай инструмент по сути вопроса. Про исходный код («где в коде», «в каком файле», «куда
  править», «как реализовано») — code_search. Про регламенты, процессы и требования — kb_search.
  Про связи в коде (кто вызывает, что сломается) — инструменты code-graph. Про задачи —
  jira_search, и ТОЛЬКО если в сообщении есть слово «jira»: без него в Jira не ходи, даже
  когда спрашивают, чем занят человек.'
- 'У jira_search человек, проект и статус — ОТДЕЛЬНЫЕ аргументы (person, project, status),
  а не часть query. Фамилия, положенная в query, не найдёт ничего: исполнитель хранится полем,
  в тексте задачи его нет. В query кладут только тему («про импорт»), а если темы в вопросе
  нет — query не заполняют вовсе.'
- 'Задачи из jira_search — снимок индекса, а не живая Jira. Указывай номер задачи и ссылку,
  а когда речь о статусе — добавляй «по данным на <дата из поля updated>».'
- 'Если инструмент вернул поле citation, ОБЯЗАТЕЛЬНО заверши ответ его содержимым, скопировав
  ДОСЛОВНО — вместе с путём или ссылкой в скобках. Не сокращай до имени файла и не переписывай
  своими словами. Без полного пути ответ бесполезен: его нельзя открыть и проверить.'
- 'Отвечай строго по содержимому найденных фрагментов. Не дополняй их общими знаниями о Kubernetes,
  CI/CD и подобном: в базе описано, как это устроено именно в нашей компании, и общая практика
  может противоречить нашей.'
- 'ЭТО КАСАЕТСЯ ЛЮБОГО ИНСТРУМЕНТА, НЕ ТОЛЬКО kb_search. Если ты вызвал инструмент — отвечай
  по тому, что он вернул. НИКОГДА не придумывай имена файлов, пути, команды, скрипты и ссылки,
  которых не было в его ответе. Инструменты code-graph (god_nodes, get_neighbors, query_graph,
  shortest_path, graph_stats) возвращают готовые данные о структуре кода: их надо изложить,
  а не заменять инструкцией, как их получить самому.'
- 'Если ответ инструмента непонятен или пуст — так и скажи. Выдуманный правдоподобный ответ
  хуже честного «не получилось»: его невозможно отличить от правды.'
- У инструментов code-graph НИКОГДА не заполняй параметр project_path. Он необязательный,
  сервер уже настроен на нужный граф. Если подставить туда путь наугад, инструмент вернёт
  «graph.json not found» — и это будет не отсутствие графа, а твоя же ошибка вызова. Вызывай
  без аргументов либо только с top_n.
- Поиск возвращает несколько фрагментов, и часть из них к вопросу не относится — это нормально.
  Отвечай ТОЛЬКО на заданный вопрос, используя подходящие фрагменты, а лишние молча игнорируй.
  Не пересказывай всё найденное подряд. В строку источника включай только те документы, из
  которых ты действительно взял ответ.
- 'Если инструмент вернул found: 0 — так и скажи, что этого не нашлось, и не выдумывай ответ.
  Но сперва подумай, тот ли инструмент ты позвал: пустой ответ поиска по документации на вопрос
  о коде означает лишь то, что искать надо было через code_search.'
- 'Структурируй ответ: последовательность действий — нумерованным списком, независимые требования
  или факты — маркированным, команды и пути — в блоках кода с обратными кавычками. Сплошной
  текст в несколько строк читать неудобно.'
- Без эмодзи в заголовках и списках, без декоративных значков. Ключевые значения (сроки, количества,
  названия систем) можно выделять жирным, но без фанатизма — два-три выделения на ответ.
- Не пересказывай вопрос во вступлении и не предлагай помощь в конце. Начинай сразу с сути.
