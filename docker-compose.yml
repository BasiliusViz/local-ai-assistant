# Локальный ИИ-ассистент в закрытом контуре.
#
# Модель (Ollama) здесь НЕ разворачивается: она живёт на отдельной машине,
# её адрес задаётся в OLLAMA_URL. Этому стеку GPU не нужен - qdrant, kb и
# code-graph считают на процессоре.
#
# Все пути и порты - через переменные из .env, поэтому стек одинаково едет
# на Windows (D:\...) и на Linux (/srv/local-ai/...). Значения по умолчанию
# рассчитаны на Linux; для Windows задайте пути в .env.
#
#   docker compose up -d                     поднять
#   docker compose --profile quality up -d   + реранкер (обычно не нужен)

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      # Каталогом на хосте, а не волюмом Docker: базу проще бэкапить
      # (копирование папки при остановленном контейнере) и видно, сколько занимает
      - ${QDRANT_DIR:-./data/qdrant}:/qdrant/storage
    environment:
      # payload на диске, в оперативной памяти только векторы
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      # По умолчанию Qdrant шлёт анонимную телеметрию на свой сервер. В закрытом
      # контуре наружу не уходит ничего (проверка — check-egress.sh)
      - QDRANT__TELEMETRY_DISABLED=true

  # MCP-сервер поиска: kb_search (документы) + code_search (код).
  # К нему подключается Continue.
  kb:
    build:
      context: .
      # Зеркало PyPI для сетей без выхода на pypi.org. Пустые значения —
      # идём напрямую. Адреса живут в .env, а не в Dockerfile: у каждой
      # площадки они свои, и в репозиторий им попадать незачем
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: kb
    restart: unless-stopped
    ports:
      - "${KB_PORT:-8010}:8010"
    volumes:
      # Репозитории только на чтение: клонирует их code-graph, а индексирует kb
      - ${CODE_DIR:-./data/code}:/data:ro
      # Код релиза CB18.5 — отдельно от остального, индекс code_cb (cb_search)
      - ${CB_DIR:-./data/cb}:/cb:ro
      # Документы: на чтение для индексации и на запись для выгрузки
      # Confluence — она пишет страницы прямо сюда, в /docs/confluence
      - ${DOCS_DIR:-./data/docs}:/docs
    environment:
      - KB_RERANK=${KB_RERANK:-0}
      - KB_EXPAND=${KB_EXPAND:-1}
      - KB_MIN_SCORE=${KB_MIN_SCORE:-0.48}
      - KB_CODE_BUDGET_CHARS=${KB_CODE_BUDGET_CHARS:-6000}
      - KB_EMBED_MAX_CHARS=${KB_EMBED_MAX_CHARS:-3000}
      - KB_EXPAND_MODEL=${GEN_MODEL:-qwen3:8b}
      - KB_EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      # Адрес и ключ доступа к Ollama. По умолчанию — соседний контейнер без
      # ключа. В проде Ollama обычно за прокси или шлюзом, который требует токен
      - KB_OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/v1}
      - KB_OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - KB_OLLAMA_AUTH_HEADER=${OLLAMA_AUTH_HEADER:-Authorization}
      # Без двоеточия: ${VAR-default} оставляет ПУСТОЕ значение пустым, а
      # ${VAR:-default} подменило бы его на Bearer. Для шлюзов с x-api-key
      # префикс должен быть пустым, иначе уходит "x-api-key: Bearer <ключ>"
      - KB_OLLAMA_AUTH_PREFIX=${OLLAMA_AUTH_PREFIX-Bearer }
      # openai (по умолчанию) или native: некоторые шлюзы пробрасывают только
      # родное API Ollama (/api/embed, /api/chat), а /v1 закрыт
      - KB_OLLAMA_API=${OLLAMA_API:-openai}
      # Выгрузка Confluence запускается в этом же контейнере:
      #   docker compose exec kb python confluence/sync.py --check
      - CONFLUENCE_URL=${CONFLUENCE_URL:-}
      - CONFLUENCE_TOKEN=${CONFLUENCE_TOKEN:-}
      - CONFLUENCE_PAGES=${CONFLUENCE_PAGES:-}
      - CONFLUENCE_SPACES=${CONFLUENCE_SPACES:-}
      - CONFLUENCE_EXCLUDE=${CONFLUENCE_EXCLUDE:-}
      - CONFLUENCE_OUT=/docs/confluence
      # Выгрузка задач Jira — там же:
      #   docker compose exec kb python jira/sync.py --check
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_TOKEN=${JIRA_TOKEN:-}
      - JIRA_USER=${JIRA_USER:-}
      - JIRA_PASSWORD=${JIRA_PASSWORD:-}
      - JIRA_PROJECTS=${JIRA_PROJECTS:-}
      - JIRA_TEAM=${JIRA_TEAM:-}
      - JIRA_TEAM_GROUP=${JIRA_TEAM_GROUP:-}
      - JIRA_SINCE=${JIRA_SINCE:-}
      - JIRA_JQL=${JIRA_JQL:-}
      - JIRA_COMMENTS=${JIRA_COMMENTS:-1}
      - JIRA_FIELDS=${JIRA_FIELDS:-}
      - JIRA_OUT=/docs/jira
      # DefectDojo индексируется отсюда же (образ общий), а отвечает на
      # вопросы отдельный сервер dojo — см. ниже:
      #   docker compose exec kb python -m kb.dojo --check
      #   docker compose exec kb python -m kb.dojo_index
      - DOJO_URL=${DOJO_URL:-}
      - DOJO_TOKEN=${DOJO_TOKEN:-}
      - DOJO_PRODUCTS=${DOJO_PRODUCTS:-}
      - DOJO_VERIFY_TLS=${DOJO_VERIFY_TLS:-1}
      - DOJO_TIMEOUT=${DOJO_TIMEOUT:-90}
      - DOJO_INDEX_SEVERITIES=${DOJO_INDEX_SEVERITIES:-}
      - DOJO_INDEX_STATUS=${DOJO_INDEX_STATUS:-}
    # host.docker.internal (модель на этой же машине) сам по себе есть только
    # в Docker Desktop. На Linux с обычным Docker Engine имя не резолвится, и
    # kb молча теряет доступ к модели — при том что deploy.sh и healthcheck.sh
    # проверяют её С ХОСТА, подменяя имя на localhost, и рапортуют зелёным.
    # host-gateway закрывает эту разницу; в Docker Desktop строка безвредна
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Только Qdrant: Ollama обычно внешняя, и ждать её контейнер бессмысленно
      - qdrant

  # Уязвимости DefectDojo: MCP на :8012. Образ тот же, что у kb, отличается
  # только командой запуска — пересобирать отдельно нечего.
  #
  # Отдельный сервер нужен ради ДОСТУПА, а не удобства: аутентификации внутри
  # нет, и порт — единственный рычаг разграничения. :8010 открывается всей
  # команде, :8012 со списком уязвимостей — только AppSec и сборочному агенту,
  # правилом на брандмауэре. Данные берутся из общего индекса в Qdrant,
  # наполняет его kb (python -m kb.dojo_index).
  dojo:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: dojo
    restart: unless-stopped
    command: ["python", "-m", "kb.dojo_server"]
    ports:
      - "${DOJO_MCP_PORT:-8012}:8012"
    environment:
      # Поиск идёт по общей коллекции, поэтому нужны те же Qdrant и эмбеддер
      - KB_QDRANT_URL=http://qdrant:6333
      - KB_EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - KB_MIN_SCORE=${KB_MIN_SCORE:-0.48}
      - KB_CODE_BUDGET_CHARS=${KB_CODE_BUDGET_CHARS:-6000}
      - KB_OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/v1}
      - KB_OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - KB_OLLAMA_AUTH_HEADER=${OLLAMA_AUTH_HEADER:-Authorization}
      - KB_OLLAMA_AUTH_PREFIX=${OLLAMA_AUTH_PREFIX-Bearer }
      - KB_OLLAMA_API=${OLLAMA_API:-openai}
      # Адрес нужен и здесь: из него собираются ссылки на находки в ответах
      - DOJO_URL=${DOJO_URL:-}
      - DOJO_TOKEN=${DOJO_TOKEN:-}
      - DOJO_PRODUCTS=${DOJO_PRODUCTS:-}
      - DOJO_VERIFY_TLS=${DOJO_VERIFY_TLS:-1}
      - DOJO_TIMEOUT=${DOJO_TIMEOUT:-90}
      - DOJO_INDEX_SEVERITIES=${DOJO_INDEX_SEVERITIES:-}
      - DOJO_INDEX_STATUS=${DOJO_INDEX_STATUS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  # Граф кода: git -> Graphify -> MCP на :8011.
  # Отдельный сервер намеренно: код и документация — разные источники,
  # и код можно выключить, не трогая поиск по документации.
  code-graph:
    build: &code-graph-build
      context: ./code
      # Здесь кроме PyPI ещё и apt — но только если INSTALL_GIT=yes.
      # По умолчанию git не ставится и apt не задействован вовсе
      args:
        INSTALL_GIT: ${INSTALL_GIT:-no}
        APT_URI: ${APT_URI:-http://deb.debian.org/debian}
        APT_SECURITY_URI: ${APT_SECURITY_URI:-http://deb.debian.org/debian-security}
        APT_SUITES: ${APT_SUITES:-trixie trixie-updates}
        APT_TRUSTED: ${APT_TRUSTED:-no}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: code-graph
    restart: unless-stopped
    ports:
      - "${CODE_GRAPH_PORT:-8011}:8011"
    volumes:
      - ${CODE_DIR:-./data/code}:/data
    environment:
      # Список репозиториев через запятую, задаётся в .env.
      # Приватные — с токеном в URL
      - CODE_REPOS=${CODE_REPOS:-}
      # Лимит чтения графа у Graphify — 512 МБ; большой код его превышает
      - GRAPHIFY_MAX_GRAPH_BYTES=${GRAPHIFY_MAX_GRAPH_BYTES:-2GB}

  # Граф релиза CB18.5: тот же образ, свой каталог (CB_DIR) и свой порт.
  # Инструменты отдаются с префиксом cb_ (code/mcp_prefix.py): у двух серверов
  # Graphify имена совпали бы, и Continue их путает. Релиз статичный —
  # обновляется только вручную, ./update-cb.sh. См. guides/PLAN-CB.md
  cb-graph:
    build: *code-graph-build
    container_name: cb-graph
    restart: unless-stopped
    ports:
      - "${CB_GRAPH_PORT:-8013}:8013"
    volumes:
      - ${CB_DIR:-./data/cb}:/data
    environment:
      # Клонирует repos/sync.py на хосте (update-cb.sh), не контейнер
      - CODE_REPOS=
      - MCP_PORT=8013
      # Без склейки: графы репозиториев -> одна база SQLite (code/graph_store.py)
      - GRAPH_MERGE=no
      - GRAPHIFY_MAX_GRAPH_BYTES=${GRAPHIFY_MAX_GRAPH_BYTES:-2GB}
    command: ["/app/cb-entry.sh"]

  # Веб-чат в браузере: та же модель и те же MCP, что у Continue.
  # По умолчанию НЕ поднимается: docker compose --profile webui up -d
  # Камни закрытого контура и почему так — guides/PLAN-OPEN-WEBUI.md,
  # настройка после запуска — guides/OPEN-WEBUI.md.
  # Переменные ниже применяются только при ПЕРВОМ старте, дальше живут в базе
  # Open WebUI; менять потом — в админке.
  open-webui:
    profiles: ["webui"]
    # Версия закреплена: образ в контур заносится руками, :main меняется
    # каждый день. Полный образ, не slim: в slim нет вшитых моделей
    image: ${WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.4}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      # Именованный том, не папка хоста: при первом запуске Docker копирует в
      # него вшитые модели из образа. Пустая папка хоста их закрыла бы, и
      # Open WebUI пошёл бы их качать
      - open-webui:/app/backend/data
    environment:
      # Без постоянного ключа после пересоздания контейнера всех разлогинит
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # --- ничего не качать и никуда не ходить ---
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - ENABLE_VERSION_UPDATE_CHECK=false
      - ENABLE_WEB_SEARCH=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_DIRECT_CONNECTIONS=false
      - ENABLE_OPENAI_API=false
      - ENABLE_CODE_INTERPRETER=false
      - ENABLE_EVALUATION_ARENA_MODELS=false
      # --- модель: только через ollama-gate, ключа у Open WebUI нет ---
      - ENABLE_OLLAMA_API=true
      - OLLAMA_BASE_URLS=http://ollama-gate:11435
      # Окно 4096 по умолчанию обрежет ответы инструментов
      - 'DEFAULT_MODEL_PARAMS={"num_ctx": ${WEBUI_NUM_CTX:-32768}}'
      # --- фоновые вызовы модели: оставить только заголовки чатов ---
      - ENABLE_TITLE_GENERATION=true
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_RETRIEVAL_QUERY_GENERATION=false
      - ENABLE_SEARCH_QUERY_GENERATION=false
      # --- пользователи ---
      # Новые учётки ждут одобрения админа; регистрацию закрыть в админке
      # после первого входа (первый вошедший — админ)
      - DEFAULT_USER_ROLE=pending
      # В чатах находки Dojo и код: админ чужие чаты не читает
      - ENABLE_ADMIN_CHAT_ACCESS=false
    depends_on:
      - ollama-gate

  # Прокси к шлюзу Ollama для Open WebUI (ollama_proxy.py из образа kb).
  # Зачем: Open WebUI свои заголовки (x-api-key) добавляет только в POST, а
  # список моделей GET /api/tags уходит без них — шлюз отвечает 403 и моделей
  # нет. Прокси дописывает ключ в каждый запрос и не пускает pull/delete/create.
  # Порт на хост НЕ публикуется: внутри рабочий ключ, видно только из compose
  ollama-gate:
    profiles: ["webui"]
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: ollama-gate
    restart: unless-stopped
    command: ["python", "ollama_proxy.py", "--bind", "0.0.0.0", "--port", "11435"]
    environment:
      - KB_OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/v1}
      - KB_OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - KB_OLLAMA_AUTH_HEADER=${OLLAMA_AUTH_HEADER:-Authorization}
      - KB_OLLAMA_AUTH_PREFIX=${OLLAMA_AUTH_PREFIX-Bearer }
      # Без этого print() буферизуется и в docker logs пусто
      - PYTHONUNBUFFERED=1

  # Реранкер второй ступени. По умолчанию НЕ поднимается: на наших замерах
  # прибавил один вопрос из пятнадцати, но стоил 48 секунд на запрос (CPU).
  # Поднять: docker compose --profile quality up -d, затем KB_RERANK=1
  reranker:
    profiles: ["quality"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: reranker
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${TEI_DIR:-./data/tei}:/data
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]

# Данные Open WebUI: учётки, чаты, настройки и вшитые модели из образа.
# Удалить вместе с чатами: docker volume rm <проект>_open-webui
volumes:
  open-webui:
