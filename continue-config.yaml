# ГОТОВЫЙ КОНФИГ CONTINUE — копировать целиком в:
#   Windows:      C:\Users\<логин>\.continue\config.yaml
#   Linux/macOS:  ~/.continue/config.yaml
#
# Это тот же файл, что continue-config.example.yaml, под коротким именем.
# Правится один — второй надо обновить следом, иначе разъедутся.
#
# Готовый конфиг Continue для пользователя. Копируется целиком в
#   Windows:      C:\Users\<логин>\.continue\config.yaml
#   Linux/macOS:  ~/.continue/config.yaml
# Файл создаёт само расширение Continue при первом запуске в VS Code;
# если его нет — поставьте расширение и откройте его один раз.
#
# Заменить нужно три вещи: АДРЕС-OLLAMA, АДРЕС-СЕРВЕРА и ТОКЕН.
# Ollama и сервер поиска — это разные машины: Continue ходит в модель
# напрямую, мимо kb, поэтому настройки из .env на него не действуют.
#
# После правки — ПОЛНЫЙ перезапуск VS Code. Reload window недостаточно:
# MCP-серверы при нём не переподключаются.
#
# Инструменты видны только в режиме Agent (переключатель внизу окна чата).
# В обычном Chat их нет, и выглядит это как «MCP не работает».

name: Local Assistant
version: 1.0.0
schema: v1

models:
  - name: Qwen3 8B
    provider: ollama
    model: qwen3:8b
    apiBase: http://АДРЕС-OLLAMA:11434
    roles: [chat, edit]
    # Поддержку инструментов Continue угадывает по имени модели и незнакомую
    # может счесть неспособной. Тогда в режиме Agent MCP либо не предлагается
    # вовсе, либо ведёт себя странно. Объявляем явно
    capabilities:
      - tool_use
    # Сколько секунд держать модель загруженной после запроса; -1 — всегда.
    # Continue шлёт своё значение и ПЕРЕЗАПИСЫВАЕТ настройку Ollama, так что
    # это единственный рычаг, если доступа к серверу с моделью нет. Помогает
    # против выгрузки: запрос за эмбеддингами подгружает bge-m3, и если обе
    # модели не помещаются в память, генеративная вылетает, а следующий вопрос
    # платит десятками секунд на её перезагрузку
    keepAlive: -1
    # Пределы генерации. contextLength — сколько Continue разрешено набить в
    # промпт, maxTokens — сколько модели позволено ответить.
    # Значение должно совпадать с РЕАЛЬНЫМ окном на сервере Ollama, а не с
    # тем, сколько модель способна вместить: Ollama поднимает её со своим
    # num_ctx, и если написать больше, Continue переполнит промпт, а лишнее
    # молча отвалится вместе с концом ответа — на вид «оборвалось на середине».
    # Измерить окно, не имея доступа к серверу: python selftest.py --probe-context
    defaultCompletionOptions:
      contextLength: 16384
      maxTokens: 2048
      # Пониже обычного: с инструментами важнее точность в выборе аргументов,
      # чем разнообразие формулировок
      temperature: 0.3
    # Именно requestOptions.headers, а НЕ apiKey: apiKey уходит как
    # "Authorization: Bearer <токен>", а шлюз ждёт заголовок x-api-key.
    # Если Ollama без шлюза — блок requestOptions убрать целиком.
    requestOptions:
      headers:
        x-api-key: ТОКЕН

  - name: BGE-M3 Embed
    provider: ollama
    model: bge-m3:latest
    apiBase: http://АДРЕС-OLLAMA:11434
    roles: [embed]
    requestOptions:
      headers:
        x-api-key: ТОКЕН

mcpServers:
  # Документация, код и задачи: kb_search + code_search + jira_search.
  # jira_search срабатывает только на слово «jira» в сообщении
  - name: knowledge-base
    type: streamable-http
    url: http://АДРЕС-СЕРВЕРА:8010/mcp

  # Граф кода (Graphify): структурные вопросы — кто вызывает функцию,
  # что сломается при изменении, какие модули центральные
  - name: code-graph
    type: streamable-http
    url: http://АДРЕС-СЕРВЕРА:8011/mcp

  # Уязвимости из DefectDojo, срабатывает на слово «dojo».
  # Отдельный сервер намеренно: порт — единственный способ разграничить
  # доступ, пока нет аутентификации. Если этому пользователю уязвимости
  # не положены, просто удалите этот блок — остальное продолжит работать
  - name: defectdojo
    type: streamable-http
    url: http://АДРЕС-СЕРВЕРА:8012/mcp

# Правила склеиваются в системный промпт для Agent, Chat и Edit.
# Копия из continue-rules.yaml — при правке менять в обоих местах.
# Каждое закрывает конкретную проблему, найденную на замерах: ответ
# сплошным текстом, отсутствие ссылок на источник, выдуманные пути и
# команды, обращение не к тому инструменту.
rules:
- Отвечай по-русски.
- Выбор инструмента. Про исходный код («где в коде», «в каком файле», «куда править») — code_search.
  Про регламенты, процессы и требования — kb_search. Про связи в коде (кто вызывает, что сломается)
  — инструменты code-graph. Про задачи — jira_search, и только если в сообщении есть слово «jira».
  Про уязвимости продуктов — dojo_findings, и только при слове «dojo» или «defectdojo».
- 'Названный источник — это уже просьба искать, глагол не нужен: «что у нас в конфлюэнсе про дежурство»
  — зови kb_search с source_filter="confluence".'
- 'Фильтры — отдельные аргументы, а не часть query. У jira_search это person, project, status, issue_key;
  у dojo_findings — product, status, severity. Фамилия или номер задачи, положенные в query, не найдут
  ничего: эти поля в тексте не хранятся. В query кладут только тему, и только если она есть в вопросе.'
- Если ты вызвал инструмент — отвечай по тому, что он вернул, и не придумывай имена файлов, пути,
  команды и ссылки, которых в ответе не было. Лишние фрагменты в выдаче — это нормально, молча игнорируй
  их. Если инструмент не вызывался, отвечай обычным образом, своими знаниями.
- 'Всегда показывай, откуда ответ: документ со ссылкой, файл со строкой, номер задачи, ссылку на находку.
  Если инструмент вернул поле citation — скопируй его дословно, вместе с путём.'
- Задачи и находки берутся из индекса, а не из живой системы. Если речь о статусе или количестве,
  добавь, на какую дату данные, и предложи свериться в источнике.
- 'Пустой ответ инструмента — так и скажи, не выдумывай. Но сперва подумай, тот ли инструмент ты позвал:
  поиск по документации не видит ни код, ни задачи, ни уязвимости.'
- У инструментов code-graph не заполняй параметр project_path — сервер уже настроен на нужный граф,
  а путь наугад даст ошибку «graph.json not found».
- 'Просят документ, отчёт или сводку по уязвимостям продукта — зови dojo_findings
  с response_format="report" и пиши по возвращённым полям description, impact и
  mitigation, а не по своим знаниям: там написано, что нашёл конкретный сканер в
  конкретном месте. Ответ длинный, поэтому разумно сузить отбор по уровню.'
- 'Оформление: шаги — нумерованным списком, команды и пути — в блоках кода. Без эмодзи.'
